<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="AI-native delivery pipeline: intake, investigate, spec, design, implement, test, human gate and close">
  <defs>
    <style>
      .t{font-family:'Inter','Segoe UI',Helvetica,Arial,sans-serif}
      .ph{font-size:17px;font-weight:600;fill:#f5f5f5}
      .ow{font-size:12.5px;fill:#8b8b93}
      .mono{font-family:'JetBrains Mono',Menlo,monospace;font-size:12.5px;fill:#8b8b93}
      .gold{fill:#E0A82E}
      .card{fill:#151518;stroke:#2d2d33}
      .gate{fill:#E0A82E}
      .flow{stroke:#E0A82E;stroke-width:2;stroke-dasharray:6 8;animation:dash 1.6s linear infinite}
      @keyframes dash{to{stroke-dashoffset:-28}}
      .lit{animation:lit 7s ease-in-out infinite}
      .l2{animation-delay:1s}.l3{animation-delay:2s}.l4{animation-delay:3s}.l5{animation-delay:4s}.l6{animation-delay:5s}.l7{animation-delay:6s}
      @keyframes lit{0%,8%{stroke:#E0A82E}16%,100%{stroke:#2d2d33}}
    </style>
  </defs>
  <rect width="1200" height="300" rx="22" fill="#0e0e10"/>
  <rect x=".5" y=".5" width="1199" height="299" rx="21.5" fill="none" stroke="#E0A82E" stroke-opacity=".25"/>
  <g class="t">
    <text x="40" y="46" class="mono"><tspan class="gold">// </tspan>every change moves left → right, and only on proof</text>
    <path d="M110 150 H1110" class="flow"/>
    <g>
      <rect class="card lit" x="40" y="104" width="130" height="92" rx="14"/>
      <text x="58" y="142" class="ph">Intake</text><text x="58" y="166" class="ow">Orchestrator</text>
    </g>
    <g>
      <rect class="card lit l2" x="190" y="104" width="138" height="92" rx="14"/>
      <text x="208" y="142" class="ph">Investigate</text><text x="208" y="166" class="ow">Forensics</text>
    </g>
    <g>
      <rect class="card lit l3" x="348" y="104" width="120" height="92" rx="14"/>
      <text x="366" y="142" class="ph">Spec</text><text x="366" y="166" class="ow">Forensics</text>
    </g>
    <g>
      <rect class="card lit l4" x="488" y="104" width="120" height="92" rx="14"/>
      <text x="506" y="142" class="ph">Design</text><text x="506" y="166" class="ow">Designer</text>
    </g>
    <g>
      <rect class="card lit l5" x="628" y="104" width="138" height="92" rx="14"/>
      <text x="646" y="142" class="ph">Implement</text><text x="646" y="166" class="ow">Implementor</text>
    </g>
    <g>
      <rect class="card lit l6" x="786" y="104" width="120" height="92" rx="14"/>
      <text x="804" y="142" class="ph">Test</text><text x="804" y="166" class="ow">Tester · adversarial</text>
    </g>
    <g>
      <rect class="gate" x="926" y="104" width="234" height="92" rx="14"/>
      <text x="946" y="142" class="ph" fill="#141414" style="fill:#141414">Human gate → Close</text>
      <text x="946" y="166" class="ow" style="fill:#3a2c0c">green checks · evidence · fails-on-revert</text>
    </g>
    <path d="M846 196 C846 240 697 240 697 196" fill="none" stroke="#8b8b93" stroke-width="1.5" stroke-dasharray="4 5"/>
    <text x="712" y="252" class="mono">fail → back to implement</text>
    <text x="40" y="276" class="mono">MCP ⇢ Supabase · Stripe · PostHog · Sentry · ClickUp · AppsFlyer · Meta/TikTok Ads</text>
  </g>
</svg>
