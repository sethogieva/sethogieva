name: Generate contribution snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/snake.yml"]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: sethogieva
          outputs: |
            dist/snake.svg?palette=github-light&color_snake=#B9831C&color_dots=#ebedf0,#f5e3b8,#ecc978,#e0a82e,#b9831c
            dist/snake-dark.svg?palette=github-dark&color_snake=#E0A82E&color_dots=#161b22,#3b2f14,#6e5320,#b9831c,#e0a82e

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
